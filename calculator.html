<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة أثر التبرع | ترتيل – جمعية تحفيظ القرآن الكريم بمحافظة خليص</title>
<meta name="description" content="اعرف أثر تبرعك في تعليم القرآن الكريم لأبنائنا في قرى خليص وهجرها: كم يوم دراسة، وكم طالبًا تكفل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#5f7424; --primary-dark:#46561a; --accent:#c9a54b; --accent-soft:#f4ead0;
    --bg:#f7f6f2; --card:#fff; --text:#1d2a25; --muted:#66706b; --line:#e6e4da; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  html.embedded body{background:transparent}
  .wrap{max-width:980px;margin:0 auto;padding:32px 16px 40px}
  .embedded .wrap{padding-top:8px}

  header{text-align:center;margin-bottom:24px}
  header h1{margin:0;font-size:clamp(1.5rem,4.2vw,2.2rem);color:var(--primary);font-weight:800}
  header p{margin:6px 0 0;color:var(--muted)}
  .embedded header h1{display:none}

  .lbl.center{text-align:center}
  .projs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
  .proj{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;font:inherit;cursor:pointer;text-align:center;color:var(--text);transition:all .15s}
  .proj b{display:block;font-size:1.02rem;color:var(--primary-dark)}
  .proj small{display:block;font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:2px}
  .proj:hover{border-color:var(--accent)}
  .proj.on{border-color:var(--primary);background:#f1f5e6;box-shadow:0 4px 14px rgba(95,116,36,.15)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .calc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:stretch}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 2px 14px rgba(0,0,0,.04)}

  /* ===== الإدخال ===== */
  .lbl{font-weight:700;margin-bottom:10px;display:block}
  .mode{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:20px}
  .mode button{border:0;background:transparent;font:inherit;font-weight:700;padding:9px 0;border-radius:999px;cursor:pointer;color:var(--muted)}
  .mode button.on{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(95,116,36,.3)}

  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;color:var(--text);transition:all .15s}
  .chip small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
  .chip:hover{border-color:var(--accent)}
  .chip.on{border-color:var(--primary);background:#f1f5e6;color:var(--primary-dark)}

  .amount{position:relative}
  .amount input{width:100%;font:inherit;font-size:1.9rem;font-weight:800;text-align:center;padding:12px 70px 12px 16px;
    border:2px solid var(--line);border-radius:14px;color:var(--primary-dark);direction:ltr;outline:none}
  .amount input:focus{border-color:var(--primary)}
  .amount span{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
  .amount input::-webkit-outer-spin-button,.amount input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .amount input{-moz-appearance:textfield}
  input[type=range]{width:100%;margin:18px 0 4px;accent-color:var(--primary)}
  .hint{font-size:.85rem;color:var(--muted);text-align:center}

  /* ===== النتائج ===== */
  .result{display:flex;flex-direction:column;gap:14px}
  .headline{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius);padding:22px 24px;position:relative;overflow:hidden}
  .headline::after{content:"";position:absolute;width:180px;height:180px;border:2px solid rgba(255,255,255,.12);border-radius:50%;left:-60px;top:-70px}
  .headline .k{font-size:.95rem;opacity:.9}
  .headline .big{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:800;line-height:1.15;margin:4px 0}
  .headline .big b{color:var(--accent)}
  .headline .s{opacity:.92}

  .fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .fact .n{font-size:1.6rem;font-weight:800;color:var(--primary-dark);line-height:1.2}
  .fact .t{font-size:.82rem;color:var(--muted);line-height:1.5}

  .cta{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .cta .txt{flex:1;min-width:200px}
  .cta .txt b{color:var(--primary-dark);display:block;font-size:1.05rem}
  .cta .txt span{font-size:.9rem;color:var(--muted)}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:12px 26px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(201,165,75,.35)}
  .btn:hover{filter:brightness(.95)}

  .others{margin-top:22px}
  .others h2{font-size:1.1rem;color:var(--primary);margin:0 0 12px}
  .plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .p{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--primary);border-radius:14px;padding:14px 16px;transition:transform .15s, box-shadow .15s}
  .p:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
  .p b{display:block;color:var(--primary-dark)}
  .p span{font-size:.85rem;color:var(--muted)}

  .hadith{margin-top:22px;text-align:center;color:var(--primary-dark);font-weight:700;font-size:1.05rem}
  .hadith small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}

  @media (max-width:560px){ .projs{gap:6px} .proj{padding:10px 4px} .proj b{font-size:.9rem} .proj small{display:none} }
  @media (max-width:760px){
    .calc{grid-template-columns:minmax(0,1fr)}
    .panel{padding:18px}
    .facts .fact .n{font-size:1.35rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>حاسبة أثر التبرع</h1>
    <p>اختر المشروع والمبلغ، واعرف أثر تبرعك في تعليم القرآن لأبنائنا في قرى خليص وهجرها</p>
  </header>

  <span class="lbl center">اختر المشروع</span>
  <div class="projs" id="projs" role="tablist"></div>

  <div class="calc">
    <!-- الإدخال -->
    <section class="panel" aria-label="مبلغ التبرع">
      <div id="modeWrap">
        <span class="lbl">نوع التبرع</span>
        <div class="mode" role="tablist">
          <button class="on" data-mode="once" role="tab" aria-selected="true">مرة واحدة</button>
          <button data-mode="monthly" role="tab" aria-selected="false">شهريًا</button>
        </div>
      </div>

      <span class="lbl">المبلغ</span>
      <div class="chips" id="chips"></div>

      <div class="amount">
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" value="100" aria-label="مبلغ التبرع بالريال">
        <span>ريال</span>
      </div>
      <input id="range" type="range" min="1" max="5000" step="1" value="100" aria-label="اسحب لاختيار المبلغ">
      <p class="hint" id="hint"></p>
    </section>

    <!-- النتائج -->
    <section class="result" aria-live="polite">
      <div class="headline">
        <div class="k" id="hk"></div>
        <div class="big"><b id="bigN"></b> <span id="bigU"></span></div>
        <div class="s" id="hs"></div>
      </div>

      <div class="facts" id="facts"></div>

      <div class="cta">
        <div class="txt"><b id="ctaT"></b><span id="ctaS"></span></div>
        <a class="btn" id="ctaB" href="#" target="_top">تبرع الآن</a>
      </div>
    </section>
  </div>

  <section class="others">
    <h2>مشاريع أخرى تستطيع دعمها</h2>
    <div class="plist" id="plist"></div>
  </section>

  <p class="hadith">«خيرُكم من تعلَّم القرآنَ وعلَّمه»<small>رواه البخاري</small></p>
</div>

<script>
/* ===================== الإعدادات – عدّلها عند تغيّر التكاليف ===================== */
const DAY_COST   = 1;    // تكلفة يوم دراسي لطالب (ريال)
const MONTH_DAYS = 22;   // أيام الدراسة الفعلية في الشهر (بدون الجمعة والسبت)
const SHARE_COST = 26;   // قيمة السهم في وقف مجمع ترتيل

const PROJECTS = {
  student: {
    tab: "كفالة طالب", tabNote: "ريال عن كل يوم دراسي",
    title: "علّمني ولك مثل أجري", url: "https://quranqulais.sa/projects/186",
    note: "كفالة طالب بـ22 ريالًا شهريًا", monthly: true,
    presets: { once: [22, 66, 132, 264, 500, 1000], monthly: [22, 44, 66, 110, 220, 440] },
    def: { once: 264, monthly: 22 }
  },
  waqf: {
    tab: "وقف مجمع ترتيل", tabNote: "السهم بـ26 ريالًا",
    title: "مشروع تعليم القرآن", url: "https://quranqulais.sa/projects/185",
    note: "سهمك في وقف مجمع ترتيل – صدقة جارية", monthly: true,
    presets: { once: [26, 52, 130, 260, 520, 1040], monthly: [26, 52, 78, 130, 260, 520] },
    def: { once: 130, monthly: 26 }
  },
  daily: {
    tab: "البركة اليومية", tabNote: "ريال كل يوم",
    title: "البركة اليومية", url: "https://quranqulais.sa/projects/184",
    note: "ريال يوميًا لوقف مجمع ترتيل", monthly: false,
    presets: { once: [30, 90, 180, 365, 730, 1000] },
    def: { once: 365 }
  }
};
// مشاريع تظهر روابطها فقط (بدون حساب)
const OTHER = [
  { title: "كفالة حلقة", url: "https://quranqulais.sa/projects/177", note: "اكفل حلقة قرآنية كاملة" },
  { title: "له أجران",  url: "https://quranqulais.sa/projects/189", note: "حلقات الأمهات وكبيرات السن" }
];
/* ============================================================================ */

if (window.self !== window.top) document.documentElement.classList.add("embedded");
const $ = id => document.getElementById(id);
const MONTH_COST = DAY_COST * MONTH_DAYS;
let proj = "student", mode = "once";

const num = n => { const r = Math.round(n * 10) / 10; return (Number.isInteger(r) ? r : +r.toFixed(1)).toLocaleString("en-US"); };
const whole = n => Math.floor(n).toLocaleString("en-US");
// اختيار صيغة الكلمة بحسب العدد
function pl(n, one, two, few, many){ n = Math.floor(n); return n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? few : many; }
const fact = (n, t) => `<div class="fact"><div class="n">${n}</div><div class="t">${t}</div></div>`;

function renderProjects(){
  $("projs").innerHTML = Object.entries(PROJECTS).map(([k, p]) =>
    `<button class="proj${k === proj ? " on" : ""}" data-p="${k}" role="tab" aria-selected="${k === proj}"><b>${p.tab}</b><small>${p.tabNote}</small></button>`).join("");
}
function renderChips(){
  const P = PROJECTS[proj];
  $("modeWrap").hidden = !P.monthly;
  $("chips").innerHTML = P.presets[mode].map(v => `<button class="chip" data-v="${v}">${v.toLocaleString("en-US")}</button>`).join("");
}

function setAmount(v, from){
  v = Math.max(1, Math.min(100000, Math.round(+v || 0)));
  if (from !== "input") $("amount").value = v;
  if (from !== "range") $("range").value = Math.min(v, +$("range").max);
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", +c.dataset.v === v));
  update(v);
}

function update(v){
  const P = PROJECTS[proj];
  const monthly = P.monthly && mode === "monthly";
  const total = monthly ? v * 12 : v;          // في الشهري نعرض أثر سنة كاملة
  let hk, bigN, bigU, hs, facts = "", hint;

  if (proj === "student") {
    const days = total / DAY_COST;
    hk = monthly ? "تبرعك الشهري يوفّر خلال سنة" : "تبرعك يوفّر";
    bigN = num(days); bigU = pl(days, "يوم تعليم", "يوما تعليم", "أيام تعليم", "يوم تعليم");
    hs = "لطلاب حلقات تحفيظ القرآن الكريم في قرى خليص وهجرها";
    const perMonth = v / MONTH_COST, months = total / MONTH_COST;
    facts += perMonth >= 1
      ? fact(whole(perMonth), monthly ? pl(perMonth,"طالب تكفله كل شهر","طالبان تكفلهما كل شهر","طلاب تكفلهم كل شهر","طالبًا تكفلهم كل شهر")
                                      : pl(perMonth,"طالب تكفله شهرًا كاملًا","طالبان تكفلهما شهرًا","طلاب تكفلهم شهرًا كاملًا","طالبًا تكفلهم شهرًا كاملًا"))
      : fact(num(days), pl(days,"يوم دراسي لطالب","يوما دراسة لطالب","أيام دراسة لطالب","يومًا دراسيًا لطالب"));
    facts += fact(num(months), months < 1 ? "من شهر دراسة لطالب واحد" : pl(months,"شهر دراسة لطالب واحد","شهرا دراسة لطالب واحد","أشهر دراسة لطالب واحد","شهرًا دراسيًا لطالب واحد"));
    hint = monthly ? `${v.toLocaleString("en-US")} ريال شهريًا = ${(v*12).toLocaleString("en-US")} ريال في السنة`
                   : `كل ريال = يوم دراسي لطالب • ${MONTH_COST} ريالًا = شهر كامل (${MONTH_DAYS} يومًا دراسيًا)`;
  }
  else if (proj === "waqf") {
    const shares = Math.floor(total / SHARE_COST), rest = total - shares * SHARE_COST;
    hk = monthly ? "تبرعك الشهري يصبح خلال سنة" : "تبرعك يساوي";
    if (shares >= 1) { bigN = shares.toLocaleString("en-US"); bigU = pl(shares,"سهم","سهمان","أسهم","سهمًا"); }
    else { bigN = num(total / SHARE_COST * 100) + "%"; bigU = "من سهم"; }
    hs = "في وقف مجمع ترتيل لتعليم القرآن – صدقة جارية يمتد أجرها";
    facts += fact(SHARE_COST + " ريالًا", "قيمة السهم الواحد");
    facts += !monthly && rest > 0 && shares >= 1
      ? fact(rest.toLocaleString("en-US") + " ريال", `زيادة لا تكمل سهمًا • أكمل إلى ${((shares + 1) * SHARE_COST).toLocaleString("en-US")} لسهم إضافي`)
      : fact("∞", "أجر جارٍ ما دام القرآن يُعلَّم فيه");
    hint = monthly ? `${v.toLocaleString("en-US")} ريال شهريًا = ${(v*12).toLocaleString("en-US")} ريال في السنة`
                   : `السهم ${SHARE_COST} ريالًا • اختر مضاعفاته لأسهم كاملة`;
  }
  else { // البركة اليومية
    hk = "تبرعك يغطي";
    bigN = v.toLocaleString("en-US"); bigU = pl(v, "يوم بركة", "يوما بركة", "أيام بركة", "يومًا من البركة");
    hs = "بريال كل يوم لوقف مجمع ترتيل لتعليم القرآن";
    const m = v / 30;
    facts += fact(num(m), m < 1 ? "من شهر" : pl(m,"شهر","شهران","أشهر","شهرًا"));
    facts += fact(num(v / 365), v < 365 ? "من سنة" : "سنة من العطاء اليومي");
    hint = "ريال واحد عن كل يوم";
  }

  $("hk").textContent = hk; $("bigN").textContent = bigN; $("bigU").textContent = bigU; $("hs").textContent = hs;
  $("facts").innerHTML = facts; $("hint").textContent = hint;
  $("ctaT").textContent = P.title; $("ctaS").textContent = P.note; $("ctaB").href = P.url;

  $("plist").innerHTML = [...Object.values(PROJECTS).filter(x => x !== P), ...OTHER].map(x =>
    `<a class="p" href="${x.url}" target="_top"><b>${x.title}</b><span>${x.note}</span></a>`).join("");
}

function selectProject(k){
  proj = k;
  if (!PROJECTS[k].monthly) mode = "once";
  renderProjects(); renderChips();
  document.querySelectorAll(".mode button").forEach(x => { const on = x.dataset.mode === mode; x.classList.toggle("on", on); x.setAttribute("aria-selected", on); });
  setAmount(PROJECTS[k].def[mode]);
}

$("projs").addEventListener("click", e => { const b = e.target.closest(".proj"); if (b) selectProject(b.dataset.p); });
document.querySelector(".mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll(".mode button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
  renderChips();
  setAmount(PROJECTS[proj].def[mode]);
});
$("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) setAmount(+c.dataset.v); });
$("amount").addEventListener("input", e => setAmount(e.target.value, "input"));
$("range").addEventListener("input", e => setAmount(e.target.value, "range"));

selectProject("student");
</script>
</body>
</html>
